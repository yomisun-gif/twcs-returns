<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>派遣登入測試</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  body { font-family: system-ui, "Noto Sans TC", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  .box { margin-top: 20px; padding: 16px; border-radius: 10px; background: #f4f6f8; display: none; }
  .ok { background: #e8f6ec; }
  .bad { background: #fdecea; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 6px 4px; border-bottom: 1px solid #ddd; font-size: 14px; word-break: break-all; }
  td:first-child { width: 120px; color: #666; }
</style>
</head>
<body>
  <h1>派遣帳號 Google 登入測試</h1>
  <p>請用公司派遣信箱（@shopeemobile-external.com）登入，成功後把下方結果截圖回傳。</p>

  <!-- ⚠️ 把 YOUR_CLIENT_ID 換成 GCP OAuth Client ID -->
  <div id="g_id_onload"
       data-client_id="1065926217249-61fk1ji75kc7ksg0j3hsjls7h8ojv1pe.apps.googleusercontent.com"
       data-callback="onCredential"
       data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-text="signin_with" data-locale="zh-TW"></div>

  <div id="result" class="box"></div>

<script>
  function decodeJwt(token) {
    const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(b64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }

  function onCredential(resp) {
    const p = decodeJwt(resp.credential);
    const isExternal = /@shopeemobile-external\.com$/i.test(p.email || '');
    const box = document.getElementById('result');
    box.className = 'box ' + (isExternal ? 'ok' : 'bad');
    box.style.display = 'block';
    box.innerHTML = `
      <strong>${isExternal ? '✅ 派遣帳號登入成功' : '⚠️ 登入成功，但不是派遣網域'}</strong>
      <table>
        <tr><td>email</td><td>${p.email || ''}</td></tr>
        <tr><td>hd（網域）</td><td>${p.hd || '（無）'}</td></tr>
        <tr><td>email_verified</td><td>${p.email_verified}</td></tr>
        <tr><td>name</td><td>${p.name || ''}</td></tr>
      </table>`;
  }
</script>
</body>
</html>
